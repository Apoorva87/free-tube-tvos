name: freeTube
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    tvOS: '17.6'
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '35'
targets:
  freeTube:
    type: application
    platform: tvOS
    sources:
      - path: App
        type: syncedFolder
      - path: Vendor/SmartTubeIOS/Sources/SmartTubeIOSCore
    configFiles:
      Debug: Configuration/Build.xcconfig
      Release: Configuration/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CHANNELROOM_BUNDLE_ID)
        PRODUCT_NAME: freeTube
        INFOPLIST_FILE: Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: freeTube Brand
        CODE_SIGN_STYLE: Automatic
  freeTubePlaybackTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [PlaybackTests]
    dependencies:
      - target: freeTube
    configFiles:
      Debug: Configuration/Build.xcconfig
      Release: Configuration/Build.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(CHANNELROOM_BUNDLE_ID).playbacktests
  freeTubeUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [Tests]
    dependencies:
      - target: freeTube
    configFiles:
      Debug: Configuration/Build.xcconfig
      Release: Configuration/Build.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(CHANNELROOM_BUNDLE_ID).uitests
        TEST_TARGET_NAME: freeTube
schemes:
  freeTube:
    build:
      targets:
        freeTube: all
    run:
      config: Debug
    test:
      targets: [freeTubePlaybackTests, freeTubeUITests]
    archive:
      config: Release
